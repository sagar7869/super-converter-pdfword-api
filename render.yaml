services:
  - type: web
    name: super-converter-pdfword-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: MAX_PDF_MB
        value: "25"
      - key: MAX_PDF_PAGES
        value: "80"
      - key: OCR_TIMEOUT_SECONDS
        value: "600"
      - key: OFFICE_TIMEOUT_SECONDS
        value: "600"
